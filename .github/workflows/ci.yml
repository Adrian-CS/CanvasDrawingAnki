name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the stroke dataset
        run: python3 tools/check_stroke_data.py

      - name: Stroke-checking tests
        run: node tests/test_checking.js

      - name: Byte-compile the add-on
        run: python3 -m compileall -q __init__.py drawing tools
